name: Papers Auto-Ingest

on:
  schedule:
    # Every Monday 06:00 UTC (~weekly update)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch+analyze only (do not update papers.yaml / open PR)"
        type: boolean
        default: false
      lookback_days:
        description: "How many recent days to search (weekly default 21)"
        type: number
        default: 21

concurrency:
  group: papers-ingest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so create-pull-request can push a branch
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || 21 }}
        run: |
          set -euo pipefail
          ARGS=(--lookback-days "${LOOKBACK_DAYS}")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/pipeline/run_pipeline.py "${ARGS[@]}"

      - name: Ensure website is built
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: python website/build.py

      - name: Upload run report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: |
            data/pipeline/last_run_report.json
            data/pipeline/last_run_report.md
            data/pipeline/candidates_related.json
          if-no-files-found: warn

      - name: Create Pull Request
        id: cpr
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(papers): weekly auto-ingest transformer-on-silicon papers"
          title: "chore(papers): weekly auto-ingest update"
          body: |
            ## Weekly papers ingest

            Automated OpenAlex + arXiv search for transformer / LLM / ViT hardware papers.

            - New entries: `ignore: check`, **Pass 1** — review in local admin before public finalize
            - Your existing Pass 1 / 2 / 3 decisions in `data/papers.yaml` are **preserved** (append-only)
            - Regenerated: `README.md`, `data/papers.csv`, plot, `website/dist`

            See `data/pipeline/last_run_report.md` for added titles.

            Optional AI secrets (`GROQ_API_KEY`, `GEMINI_API_KEY`) improve analysis; heuristic fallback always works.
          branch: auto/papers-ingest
          delete-branch: true
          add-paths: |
            data/papers.yaml
            data/papers.csv
            data/img/publications.png
            README.md
            website/dist
            data/pipeline/last_run_report.json
            data/pipeline/last_run_report.md
            data/pipeline/candidates_related.json

      - name: Fallback open PR via gh (if needed)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && steps.cpr.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning::create-pull-request action failed; trying gh pr create"
          echo "If this also fails, enable: Settings → Actions → General → Workflow permissions"
          echo "  • Read and write permissions"
          echo "  • Allow GitHub Actions to create and approve pull requests"
          echo "Compare URL: https://github.com/${{ github.repository }}/compare/main...auto/papers-ingest?expand=1"

          # Branch may already exist from the previous step
          if git ls-remote --exit-code --heads origin auto/papers-ingest; then
            if gh pr list --head auto/papers-ingest --state open --json number --jq 'length' | grep -qx '0'; then
              gh pr create \
                --base main \
                --head auto/papers-ingest \
                --title "chore(papers): weekly auto-ingest update" \
                --body "$(cat <<'EOF'
          ## Weekly papers ingest

          Automated OpenAlex + arXiv search for transformer / LLM / ViT hardware papers.

          - New entries: \`ignore: check\`, **Pass 1**
          - Existing Pass 1 / 2 / 3 decisions preserved (append-only)

          See \`data/pipeline/last_run_report.md\`.
          EOF
          )"
            else
              echo "PR already open for auto/papers-ingest"
              gh pr list --head auto/papers-ingest --state open
            fi
          else
            echo "::error::Branch auto/papers-ingest was not pushed. Check contents: write permission."
            exit 1
          fi

      - name: Summarize
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          echo "### Weekly ingest" >> "$GITHUB_STEP_SUMMARY"
          echo "- CPR outcome: \`${{ steps.cpr.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`auto/papers-ingest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Open PR / compare: https://github.com/${{ github.repository }}/compare/main...auto/papers-ingest?expand=1" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/pipeline/last_run_report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat data/pipeline/last_run_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
